name: Docs issue
description: Report missing, unclear, or incorrect documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is confusing, missing, or incorrect?
      placeholder: The docs say ...
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Location
      description: Link the page or file path when possible.
      placeholder: README.md or https://...
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      placeholder: It would be clearer if ...
    validations:
      required: false
